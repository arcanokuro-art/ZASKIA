name: ZASKIA Android APK
on:
  workflow_dispatch:
  push:
    branches: [develop/flutter-ui-v0.1]
permissions:
  contents: write
concurrency:
  group: zaskia-android-release
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Generate Android Flutter scaffold
        run: |
          scaffold="$(mktemp -d)"
          flutter create --no-pub --platforms=android --org com.zaskarstartup --project-name zaskia "$scaffold"
          cp -a "$scaffold/android" android
          sed -i "s/minSdk = flutter.minSdkVersion/minSdk = 26/" android/app/build.gradle.kts
          sed -i '/release {/a\                    isMinifyEnabled = false\n                    isShrinkResources = false' android/app/build.gradle.kts
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/a\        android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
          sed -i 's/FlutterActivity/FlutterFragmentActivity/g' android/app/src/main/kotlin/com/zaskarstartup/zaskia/MainActivity.kt
          sed -i '/<application/i\    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' android/app/src/main/AndroidManifest.xml
          find android/app/src/main/res -name styles.xml -exec sed -i -E 's/@android:style\/Theme\.(Light|Black)\.NoTitleBar/Theme.AppCompat.DayNight.NoActionBar/g' {} +
          sed -i 's/android:label="zaskia"/android:label="ZASKIA"/' android/app/src/main/AndroidManifest.xml
      - name: Resolve dependencies
        run: flutter pub get
      - name: Configure portable Android ARM64 CPU
        run: |
          python3 -m unittest discover -s test -p '*_test.py'
          python3 tool/android/configure_cpu.py
      - name: Analyze Dart code
        run: flutter analyze
      - name: Test chat interface
        run: flutter test
      - name: Configure persistent APK signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ZASKIA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ZASKIA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZASKIA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZASKIA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing ZASKIA_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing ZASKIA_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ZASKIA_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ZASKIA_KEY_PASSWORD"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/zaskia-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=zaskia-release.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = 'import java.util.Properties\nimport java.io.FileInputStream\n' + s
          s = s.replace('android {', '''val keyProperties = Properties().apply {
              load(FileInputStream(rootProject.file("key.properties")))
          }
          android {''', 1)
          s = s.replace('    buildTypes {', '''    signingConfigs {
                  create("release") {
                      keyAlias = keyProperties["keyAlias"] as String
                      keyPassword = keyProperties["keyPassword"] as String
                      storeFile = file(keyProperties["storeFile"] as String)
                      storePassword = keyProperties["storePassword"] as String
                  }
              }
              buildTypes {''', 1)
          debug = 'signingConfig = signingConfigs.getByName("debug")'
          assert s.count(debug) == 1 and s.count('create("release")') == 1
          s = s.replace(debug, 'signingConfig = signingConfigs.getByName("release")')
          p.write_text(s)
          PY
      - name: Build signed release APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify signed APK
        run: |
          set -euo pipefail
          version="$(awk '/^version: / { print $2 }' pubspec.yaml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[1-9][0-9]*$ ]]
          app_version="${version%+*}"
          apk="ZASKIA-v$app_version.apk"
          sdk_tools="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$sdk_tools" sign --ks android/app/zaskia-release.jks --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$apk" build/app/outputs/flutter-apk/app-release.apk
          expected="$(keytool -exportcert -keystore android/app/zaskia-release.jks -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD | sha256sum | cut -d ' ' -f1)"
          certs="$("$sdk_tools" verify --print-certs "$apk")"
          actual="$(awk '/certificate SHA-256 digest:/ {print $NF}' <<< "$certs")"
          [[ "$expected" == "0f3de3ecee703df49d663ed02765aaaa17e37bb0b2497def35c9fdbefc8849bd" ]] || { echo "::error::Signing key differs from ZASKIA 0.1.0"; exit 1; }
          [[ "${actual,,}" == "$expected" ]] || { echo "::error::APK signing certificate mismatch (expected $expected, got $actual)"; exit 1; }
          badging="$("${sdk_tools%/*}/aapt" dump badging "$apk")"
          package_info="$(awk '/^package:/ { print; exit }' <<< "$badging")"
          expected_code="${version##*+}"
          for field in "name='com.zaskarstartup.zaskia'" "versionCode='$expected_code'" "versionName='$app_version'"; do
            [[ "$package_info" == *"$field"* ]] || { echo "::error::Unexpected APK package metadata: $package_info"; exit 1; }
          done
          echo "APK=$apk" >> "$GITHUB_ENV"
          echo "TAG=v$app_version" >> "$GITHUB_ENV"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ZASKIA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZASKIA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZASKIA_KEY_PASSWORD }}
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZASKIA-APK
          path: ${{ env.APK }}
          if-no-files-found: error
      - name: Publish development prerelease
        if: github.ref == 'refs/heads/develop/flutter-ui-v0.1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
            --title "ZASKIA $TAG" \
            --notes "Ejecución local de modelos de texto GGUF descargados desde Hugging Face o importados. Android 8 o superior, ARM64." || gh release view "$TAG"
          gh release upload "$TAG" "$APK" --clobber
